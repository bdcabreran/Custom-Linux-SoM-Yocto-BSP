# Layer config for the custom SoM BSP
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "custom-som"
BBFILE_PATTERN_custom-som = "^${LAYERDIR}/"
BBFILE_PRIORITY_custom-som = "10"

# stm-st-stm32mp is ST's BSP layer, meta-st-stm32mp (OpenSTLinux 6.2)
LAYERDEPENDS_custom-som = "core stm-st-stm32mp"
LAYERSERIES_COMPAT_custom-som = "scarthgap"

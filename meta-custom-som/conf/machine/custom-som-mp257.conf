#@TYPE: Machine
#@NAME: custom-som-mp257
#@DESCRIPTION: Custom SoM with STM32MP257F (TFBGA436) on its carrier board
#@NEEDED_BSPLAYERS: layers/meta-openembedded/meta-oe layers/meta-openembedded/meta-python

# Based on stm32mp25-eval.conf from meta-st-stm32mp (scarthgap, OpenSTLinux 6.2).
#
# Bring-up stage: the SoM does not exist yet, so this machine still builds the
# STM32MP257F-EV1 device trees. The image runs on an EV1 board, which has the
# same STM32MP257FAI3 part. Replace every "stm32mp257f-ev1" below with our own
# device tree when the pad map and schematic are ready.

# Define specific family common machine name
MACHINEOVERRIDES =. "stm32mp2common:stm32mp25common:"

include conf/machine/include/st-machine-common-stm32mp.inc
include conf/machine/include/st-machine-providers-stm32mp.inc

# =========================================================================
# Chip architecture
# =========================================================================
DEFAULTTUNE = "cortexa35"
include conf/machine/include/arm/armv8a/tune-cortexa35.inc

# =========================================================================
# Boot scheme
# =========================================================================
BOOTSCHEME_LABELS = "optee"

# =========================================================================
# Boot device: eMMC on the SoM, microSD on the carrier
# =========================================================================
BOOTDEVICE_LABELS += "emmc"
BOOTDEVICE_LABELS += "sdcard"

# =========================================================================
# Device tree (EV1 placeholder, see note at the top)
# =========================================================================
EXTERNAL_DT_ENABLED = "1"

STM32MP_DT_FILES_EMMC += "stm32mp257f-ev1"
STM32MP_DT_FILES_SDCARD += "stm32mp257f-ev1"

EXTERNAL_DEVICETREE_EMMC = "stm32mp257f-ev1-ca35tdcid-ostl"
EXTERNAL_DEVICETREE_SDCARD = "stm32mp257f-ev1-ca35tdcid-ostl"

# =========================================================================
# Machine features
# =========================================================================
MACHINE_FEATURES += "splashscreen"
MACHINE_FEATURES += "watchdog"

# GPU: the Vivante driver is a vendor binary under the ST EULA.
# It is only enabled when local.conf has: ACCEPT_EULA_custom-som-mp257 = "1"
MACHINE_FEATURES += "${@'gpu' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"
MACHINE_FEATURES += "${@'vulkan' if d.getVar('ACCEPT_EULA_'+d.getVar('MACHINE')) == '1' else ''}"

# meta-st-stm32mp looks for the EULA text in its own conf/eula/${MACHINE}.
# That file does not exist for our machine name, so point at the ST one.
EULA_FILE_ST:custom-som-mp257 = "${STM32MP_BASE}/conf/eula/ST_EULA_SLA"

# The Cortex-M33 and Cortex-M0+ are not used yet. Add "m33copro" and the
# M33FW_* settings from stm32mp25-eval.conf when a coprocessor firmware exists.

# =========================================================================
# OP-TEE
# =========================================================================
# For SDK generation, the default board configuration to use
ST_OPTEE_EXPORT_TA_REF_BOARD:stm32mp2common = "stm32mp257f-ev1.dts"

# =========================================================================
# WIC for a raw SD card image
# =========================================================================
WIC_CREATE_EXTRA_ARGS = "--no-fstab-update"
WKS_FILE_DEPENDS ?= " \
    virtual/bootloader \
    virtual/trusted-firmware-a \
    virtual-optee-os \
"
OPTEE_WIC_FILE = "${@bb.utils.contains('ST_VENDORFS','1','sdcard-stm32mp257f-ev1-optee-vendorfs-example.wks.in','sdcard-stm32mp257f-ev1-optee-example.wks.in',d)}"

# To generate a WIC file, uncomment the two lines below or add them to local.conf
#WKS_IMAGE_FSTYPES += "wic wic.bz2 wic.bmap"
#WKS_FILE += "${OPTEE_WIC_FILE}"
